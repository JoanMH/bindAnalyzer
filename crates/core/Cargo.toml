[package]
name = "bindanalyzer-core"
description = "Modelo, parser y consultas sobre los binds de Hyprland"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "bindanalyzer_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
fuzzy-matcher = "0.3"
glob = "0.3"
