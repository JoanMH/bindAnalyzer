[package]
name = "bindanalyzer"
description = "Chuleta y analizador de atajos de teclado de Hyprland"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "bindanalyzer"
path = "src/main.rs"

[dependencies]
bindanalyzer-core = { path = "../core" }
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"
